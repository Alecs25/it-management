[app]
name=IT Credential Management App
version=0.1.0
environment=development
timezone=Europe/Rome

[server]
port=3000
host=0.0.0.0
nodeEnv=development

[database]
type=mysql
host=localhost
port=3306
username=root
password=
database=it_management
synchronize=false
logging=false

[jwt]
secret=CHANGE_ME_IN_PRODUCTION
expiresIn=1h
refreshExpiresIn=7d

[mfa]
window=1
issuer=ITCredentialManagement
appName=IT-Management

[security]
passwordHashRounds=12
mfaCodeLength=6
mfaWindowMs=30000
pinHashRounds=12
revelTtlSeconds=30
rateLimitWindowMs=900000
rateLimitMaxRequests=100

[crypto]
algorithm=aes-256-gcm
kmsStubKey=STUB_KEY_DEVELOPMENT_ONLY

[audit]
enableAppendOnly=true
enableHmacSigning=true

[cors]
origin=http://localhost:4200
credentials=true

[log]
level=info
format=json
